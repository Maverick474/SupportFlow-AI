name: supportflow

services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: my-secret-runner-token
    volumes:
      - n8n_data:/home/node/.n8n

  n8n-runner:
    image: n8nio/runners:latest
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: my-secret-runner-token
    depends_on:
      - n8n

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: supportflow-backend:dev
    restart: unless-stopped
    init: true
    env_file:
      - ./server/.env
    environment:
      # Docker service names replace localhost for internal connections.
      MONGODB_URI: mongodb://mongodb:27017/supportflow
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: supportflow-client:dev
    restart: unless-stopped
    init: true
    environment:
      BACKEND_TARGET: http://server:8000
    ports:
      - "5173:4173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:4173/login
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data:
  redis_data:
  n8n_data:
    external: true
    name: week5_n8n_data
